<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ভিউয়ার ফোন (Controller)</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #111; color: #fff; padding: 20px; }
        video { width: 100%; max-width: 500px; border-radius: 10px; border: 3px solid #007bff; background: #000; }
        button { padding: 12px 24px; font-size: 16px; margin: 10px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-connect { background: #007bff; color: white; }
        .btn-ctrl { background: #ffc107; color: black; }
        .status { font-size: 16px; color: #00ff00; margin: 10px; }
    </style>
</head>
<body>

    <h2>📱 রিমোট ক্যামেরা ভিউয়ার</h2>
    <div class="status" id="status">ভিডিও দেখার জন্য কানেক্ট বাটনে চাপুন</div>
    
    <video id="remoteVideo" autoplay playsinline controls style="transform: scaleX(1);"></video>
    <br>

    <button class="btn-connect" id="connectBtn">🎥 লাইভ ক্যামেরা কানেক্ট করুন</button>
    <button class="btn-ctrl" id="flashBtn">🔦 টর্চ অন/অফ</button>

    <script>
        const peer = new Peer(); 
        const CAMERA_ID = 'akash-remote-camera-123'; // ক্যামেরা আইডির সাথে মিল রাখা হয়েছে
        let dataConnection;

        // কানেক্ট বাটনে ক্লিক করলে
        document.getElementById('connectBtn').addEventListener('click', () => {
            document.getElementById('status').innerText = "ক্যামেরায় কল করা হচ্ছে...";

            // ডাটা কানেকশন তৈরি করা (টর্চ লাইটের জন্য)
            dataConnection = peer.connect(CAMERA_ID);

            // ভিডিওর জন্য সরাসরি কল করা
            const call = peer.call(CAMERA_ID, null); // আমরা নিজের ভিডিও পাঠাচ্ছি না, শুধু রিসিভ করব
            
            call.on('stream', (remoteStream) => {
                const videoElement = document.getElementById('remoteVideo');
                videoElement.srcObject = remoteStream;
                
                // ব্রাউজারকে জোর করে প্লে করতে বলা
                videoElement.play().catch(e => console.log("Auto-play prevented", e));
                document.getElementById('status').innerText = "✅ লাইভ ভিডিও সচল আছে!";
            });
            
            call.on('error', (err) => {
                document.getElementById('status').innerHTML = `<span style="color:red">কল ফেইল হয়েছে: ${err}</span>`;
            });
        });

        // টর্চ লাইট কমান্ড
        document.getElementById('flashBtn').addEventListener('click', () => {
            if (dataConnection && dataConnection.open) {
                dataConnection.send('toggle-flash');
            } else {
                alert("ক্যামেরার সাথে আগে কানেক্ট করুন!");
            }
        });
    </script>
</body>
</html>
